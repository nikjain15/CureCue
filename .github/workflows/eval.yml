name: eval gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check every plan rule against the page it cites
        run: node eval/check-sources.mjs
      - name: Check the synthetic data as data
        run: node eval/check-data.mjs
      - name: Score the current release against the golden set
        run: node eval/run.mjs
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/out/
